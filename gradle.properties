# HEAVY build. Prefer running SOLO (4g daemon). Safe to run alongside a LIGHT build, not another heavy one.
org.gradle.jvmargs=-Xms1024m -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/ubuntu/.gradle/tmp -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/home/ubuntu/.gradle/tmp
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true
