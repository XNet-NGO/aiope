name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore and Set API Key
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          fi
          
          # Create keystore.properties expected by build.gradle.kts
          echo "storeFile=keystore.jks" > app/keystore.properties
          echo "keyAlias=$SIGNING_KEY_ALIAS" >> app/keystore.properties
          echo "keyPassword=$SIGNING_KEY_PASSWORD" >> app/keystore.properties
          echo "storePassword=$SIGNING_STORE_PASSWORD" >> app/keystore.properties

          # Inject API Key if needed in local.properties or gradle.properties
          if [ -n "$API_KEY" ]; then
            echo "API_KEY=$API_KEY" >> local.properties
          fi

      - name: Build Universal or arm64-v8a Release APK
        run: ./gradlew assembleRelease

      - name: Create Tag & Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
